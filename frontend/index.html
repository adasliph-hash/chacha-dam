<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chacha Dam Project</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <!-- Login Screen -->
  <div id="login-screen" class="screen">
    <div class="login-card">
      <h1>🌊 Chacha Dam</h1>
      <p class="subtitle">Project Management Dashboard</p>

      <!-- Shown only when opened inside Telegram: connecting / retry state, never a password form -->
      <div id="telegram-status" class="hidden">
        <p id="telegram-status-text">Connecting…</p>
        <button id="telegram-retry-btn" class="hidden" type="button">Retry</button>
      </div>

      <form id="login-form">
        <input type="text" id="username" placeholder="Username" required />
        <input type="password" id="password" placeholder="Password" required />
        <button type="submit">Login</button>
        <p id="login-error" class="error"></p>
      </form>
    </div>
  </div>

  <!-- Main App -->
  <div id="app" class="screen hidden">
    <button id="theme-toggle" class="theme-toggle-btn" title="Toggle light/dark theme">🌙</button>

    <header>
      <div class="logo">🌊 Chacha Dam</div>
      <button id="logout-btn">Logout</button>
    </header>

    <nav id="nav">
      <button data-tab="income" class="active">
        <span class="nav-icon">💰</span>
        <span>Income</span>
      </button>
      <button data-tab="costs">
        <span class="nav-icon">📊</span>
        <span>Costs</span>
      </button>
      <button data-tab="percent">
        <span class="nav-icon">📈</span>
        <span>Progress</span>
      </button>
      <button data-tab="ecost">
        <span class="nav-icon">🚜</span>
        <span>E-Cost</span>
      </button>
      <button data-tab="chat">
        <span class="nav-icon">💬</span>
        <span>Chat</span>
      </button>
    </nav>

    <main>
      <section id="income-tab" class="tab active"></section>
      <section id="costs-tab" class="tab"></section>
      <section id="percent-tab" class="tab"></section>
      <section id="ecost-tab" class="tab"></section>
      <section id="chat-tab" class="tab"></section>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/income.js"></script>
  <script src="js/costs.js"></script>
  <script src="js/percent.js"></script>
  <script src="js/ecost.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
